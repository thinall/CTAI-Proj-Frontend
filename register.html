<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SnapFix</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/report.js"></script>
</head>
<body>

    <header class="navbar">
            <h1 class="logo">SnapFix</h1>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Log In</a>
        </nav>
    </header>

    <div class="login-container">
        <div class="login-card">
            <h2>Create an Account</h2>
            <p class="subtitle">Sign up to start reporting facility issues.</p>

            <form id="registerForm" onsubmit="registerUser(); return false">
                <label for="name_tb">Full Name</label>
                <input type="text" id="name_tb" name="name" required>

                <label for="email_tb">Email</label>
                <input type="text" id="email_tb" name="email" required>

                <label for="password_tb">Password</label>
                <input type="password" id="password_tb" name="password" required>
                <div class="hint">At least 6 characters.</div>

                <label for="confirm_tb">Confirm Password</label>
                <input type="password" id="confirm_tb" name="confirm" required>

                <div class="btn-row">
                    <button type="submit" class="primary">Create Account</button>
                </div>
            </form>

            <div id="confirmSection" style="display:none;">
                <p class="subtitle">Enter the confirmation code we emailed you to finish creating your account.</p>
                <label for="code_tb">Confirmation Code</label>
                <input type="text" id="code_tb" name="code">
                <div class="btn-row">
                    <button type="button" class="primary" onclick="confirmRegistration()">Confirm Account</button>
                </div>
            </div>

            <p class="form-foot">Already have an account? <a href="login.html">Log in here</a></p>
        </div>
    </div>

</body>
</html>
